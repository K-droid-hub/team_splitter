services:
  bot:
    # ビルド設定
    build:
      context: .
      dockerfile: docker/Dockerfile
    
    # コンテナ名（--name team_splitter の代わり）
    container_name: team_splitter
    
    # 環境変数の読み込み（--env-file .env の代わり）
    env_file:
      - .env

    # VOICEVOX エンジンの接続先（compose 内のサービス名で解決）
    environment:
      - VOICEVOX_URL=http://voicevox:50021
      # 読み上げ声設定の DB ファイル置き場（下の named volume 上）
      - VOICE_DB_PATH=/app/data/voices.db
      # 意気込みの DB ファイル置き場（同じ named volume 上）
      - ASPIRATION_DB_PATH=/app/data/aspirations.db

    # 読み上げ声設定 DB を永続化する。リビルドしても設定が消えないようにする
    volumes:
      - voice_data:/app/data

    # VOICEVOX エンジンの起動を待ってから立ち上げる
    depends_on:
      - voicevox

    # クラッシュ時のみ再起動する。累積 5 回で諦め、暴走(無限ループ)を防ぐ。
    # 正常終了(docker compose down 等)では再起動しない
    restart: on-failure:5

    # ログ設定
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 読み上げ用の音声合成エンジン
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: voicevox_engine
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 読み上げ声設定を保持する named volume
volumes:
  voice_data: